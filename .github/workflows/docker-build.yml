name: Auto Build Upstream Docker Image

on:
  workflow_dispatch:     # 支持手动点击运行
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: 检出原作者最新源码
        uses: actions/checkout@v4
        with:
          repository: 'PoemMisty/CFData-WEB'
          ref: 'v1.7.8'
          
      - name: 创建 Dockerfile
        run: |
          cat << 'EOF' > Dockerfile
          FROM golang:alpine AS builder
          WORKDIR /app

          RUN apk add --no-cache git gcc musl-dev

          COPY . .

          RUN go env -w GOPROXY=https://proxy.golang.org,direct && \
              CGO_ENABLED=0 go build -ldflags="-s -w" -o cfdata-web .

          FROM alpine:latest
          WORKDIR /app
          COPY --from=builder /app/cfdata-web .
          EXPOSE 13335
          CMD ["./cfdata-web"]
          EOF

      - name: 设置 QEMU (用于模拟多 CPU 架构)
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 镜像仓库 (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 编译并推送全架构 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          # 覆盖市场上绝大多数设备架构
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cfdata-web:latest
