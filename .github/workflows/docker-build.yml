name: Build CFData-WEB Docker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 修复：降级为真实存在的 v4 稳定版

      - name: Get latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "获取 PoemMisty/CFData-WEB 最新 Release..."
          
          TAG=$(gh api repos/PoemMisty/CFData-WEB/releases/latest --jq '.tag_name')
          echo "最新版本: $TAG"
          
          BIN_URL=$(gh api repos/PoemMisty/CFData-WEB/releases/latest --jq '.assets[] | select(.name=="cfdata-linux-arm64") | .browser_download_url')
          
          if [ -z "$BIN_URL" ]; then
            echo "错误：没有找到 cfdata-linux-arm64"
            exit 1
          fi
          
          echo "下载地址: $BIN_URL"
          curl -fL --retry 3 "$BIN_URL" -o cfdata-linux-arm64
          chmod +x cfdata-linux-arm64
          
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ls -lh cfdata-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3  # 新增：解决跨架构构建时 RUN 命令报错的问题

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5  # 修复：降级为 v5 稳定版
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cfdata-web:latest
            ghcr.io/${{ github.repository_owner }}/cfdata-web:${{ steps.release.outputs.tag }}
