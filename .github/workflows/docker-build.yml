name: Build CFData-WEB Docker

on:
  workflow_dispatch:

  schedule:
    # 每天北京时间 10:00 检查一次
    - cron: "0 2 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. 获取官方最新 Release
      - name: 获取最新 Release
        id: release
        shell: bash
        run: |
          TAG=$(curl -fsSL \
            https://api.github.com/repos/PoemMisty/CFData-WEB/releases/latest \
            | jq -r '.tag_name')

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "无法获取最新 Release"
            exit 1
          fi

          echo "官方最新版本：$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 2. 下载官方 Release 对应源码
      - name: 检出官方 Release
        uses: actions/checkout@v4
        with:
          repository: PoemMisty/CFData-WEB
          ref: ${{ steps.release.outputs.tag }}

      # 3. 准备 Docker
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录 GHCR
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. 构建 Docker
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/cfdata-web:latest
            ghcr.io/${{ github.repository_owner }}/cfdata-web:${{ steps.release.outputs.tag }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
