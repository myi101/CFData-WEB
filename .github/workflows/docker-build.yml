name: Build CFData-WEB Docker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 登录 GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 检查上游最新 Release
      - name: Check for new release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "获取 PoemMisty/CFData-WEB 最新 Release..."
          TAG=$(gh api repos/PoemMisty/CFData-WEB/releases/latest --jq '.tag_name')

          IMAGE="ghcr.io/${{ github.repository_owner }}/cfdata-web:$TAG"

          echo "最新版本: $TAG"
          echo "检查镜像: $IMAGE"

          # 检查当前版本是否已经同时包含 AMD64 + ARM64
          #
          # 这里不能只判断镜像是否存在。
          # 因为以前的 v1.7.8 / v1.7.10 可能只有 ARM64，
          # 如果单纯 docker manifest inspect 成功，就会错误地跳过构建。
          MANIFEST=$(docker manifest inspect "$IMAGE" 2>/dev/null || true)

          if echo "$MANIFEST" | grep -q '"architecture": "amd64"' && \
             echo "$MANIFEST" | grep -q '"architecture": "arm64"'; then

            echo "✅ $IMAGE 已经包含 AMD64 + ARM64"
            echo "无需重新构建。"

            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else

            echo "🚀 $IMAGE 不存在，或者不是完整的 Multi-Arch 镜像"
            echo "准备重新构建 AMD64 + ARM64..."

            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 设置 QEMU
      # ARM64 构建需要在 GitHub AMD64 Runner 上运行 ARM64 Alpine
      - name: Set up QEMU
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      # 设置 Docker Buildx
      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # AMD64
      # ============================================================

      - name: Download upstream AMD64 binary
        if: steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "下载官方 AMD64 程序..."

          BIN_URL=$(gh api repos/PoemMisty/CFData-WEB/releases/latest \
            --jq '.assets[] | select(.name=="cfdata-linux-amd64") | .browser_download_url')

          if [ -z "$BIN_URL" ]; then
            echo "❌ 错误：没有找到 cfdata-linux-amd64"
            exit 1
          fi

          echo "下载地址:"
          echo "$BIN_URL"

          curl -fL --retry 3 "$BIN_URL" -o cfdata-linux-amd64

          chmod +x cfdata-linux-amd64

          # Dockerfile 统一使用 cfdata
          cp cfdata-linux-amd64 cfdata

          echo "AMD64 文件:"
          ls -lh cfdata-linux-amd64
          ls -lh cfdata

      - name: Build and push AMD64 image
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cfdata-web:${{ steps.check.outputs.tag }}-amd64

      # ============================================================
      # ARM64
      # ============================================================

      - name: Download upstream ARM64 binary
        if: steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "下载官方 ARM64 程序..."

          BIN_URL=$(gh api repos/PoemMisty/CFData-WEB/releases/latest \
            --jq '.assets[] | select(.name=="cfdata-linux-arm64") | .browser_download_url')

          if [ -z "$BIN_URL" ]; then
            echo "❌ 错误：没有找到 cfdata-linux-arm64"
            exit 1
          fi

          echo "下载地址:"
          echo "$BIN_URL"

          curl -fL --retry 3 "$BIN_URL" -o cfdata-linux-arm64

          chmod +x cfdata-linux-arm64

          # 覆盖 Dockerfile 使用的统一文件
          cp cfdata-linux-arm64 cfdata

          echo "ARM64 文件:"
          ls -lh cfdata-linux-arm64
          ls -lh cfdata

      - name: Build and push ARM64 image
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cfdata-web:${{ steps.check.outputs.tag }}-arm64

      # ============================================================
      # 创建 Multi-Arch Manifest
      # ============================================================

      - name: Create Multi-Arch manifest
        if: steps.check.outputs.should_build == 'true'
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/cfdata-web
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -e

          echo "=========================================="
          echo "创建 Multi-Arch 镜像"
          echo "=========================================="

          AMD64_IMAGE="${IMAGE_BASE}:${TAG}-amd64"
          ARM64_IMAGE="${IMAGE_BASE}:${TAG}-arm64"

          echo "AMD64:"
          echo "$AMD64_IMAGE"

          echo "ARM64:"
          echo "$ARM64_IMAGE"

          # 创建版本号 Multi-Arch 镜像
          docker buildx imagetools create \
            --tag "${IMAGE_BASE}:${TAG}" \
            "$AMD64_IMAGE" \
            "$ARM64_IMAGE"

          echo ""
          echo "✅ 已创建:"
          echo "${IMAGE_BASE}:${TAG}"

          # 创建 latest Multi-Arch 镜像
          docker buildx imagetools create \
            --tag "${IMAGE_BASE}:latest" \
            "$AMD64_IMAGE" \
            "$ARM64_IMAGE"

          echo ""
          echo "✅ 已更新:"
          echo "${IMAGE_BASE}:latest"

      # ============================================================
      # 最终验证
      # ============================================================

      - name: Verify Multi-Arch image
        if: steps.check.outputs.should_build == 'true'
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/cfdata-web
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -e

          echo "=========================================="
          echo "验证 Multi-Arch 镜像"
          echo "=========================================="

          docker buildx imagetools inspect "${IMAGE_BASE}:${TAG}"

          echo ""
          echo "=========================================="
          echo "验证 latest"
          echo "=========================================="

          docker buildx imagetools inspect "${IMAGE_BASE}:latest"

          echo ""
          echo "=========================================="
          echo "✅ CFData-WEB Docker Multi-Arch 构建完成"
          echo "=========================================="
