name: Auto Build Upstream Docker Image

on:
  workflow_dispatch:     # 支持手动点击运行
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出原作者最新源码
        uses: actions/checkout@v4
        with:
          repository: 'PoemMisty/CFData-WEB'
          ref: 'main'

      - name: 创建修正后的 Dockerfile
        run: |
          cat << 'EOF' > Dockerfile
          FROM golang:alpine AS builder
          WORKDIR /app

          # 安装必要的基础编译依赖
          RUN apk add --no-cache git gcc musl-dev

          COPY . .

          # 适配 GitHub 海外环境的 GOPROXY 并禁用 CGO 开启纯静态编译
          RUN go env -w GOPROXY=https://proxy.golang.org,direct && \
              CGO_ENABLED=0 go build -ldflags="-s -w" -o cfdata-web .

          FROM alpine:latest
          WORKDIR /app
          COPY --from=builder /app/cfdata-web .
          EXPOSE 8080
          CMD ["./cfdata-web"]
          EOF

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 镜像仓库 (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 编译并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cfdata-web:latest
