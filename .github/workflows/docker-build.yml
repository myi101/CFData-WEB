name: Build CFData-WEB Docker

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "获取 PoemMisty/CFData-WEB 最新 Release..."

          TAG=$(gh api \
            repos/PoemMisty/CFData-WEB/releases/latest \
            --jq '.tag_name')

          echo "最新版本: $TAG"

          BIN_URL=$(gh api \
            repos/PoemMisty/CFData-WEB/releases/latest \
            --jq '.assets[] | select(.name=="cfdata-linux-arm64") | .browser_download_url')

          SUM_URL=$(gh api \
            repos/PoemMisty/CFData-WEB/releases/latest \
            --jq '.assets[] | select(.name=="cfdata-linux-arm64.sha256") | .browser_download_url')

          if [ -z "$BIN_URL" ]; then
            echo "错误：没有找到 cfdata-linux-arm64"
            exit 1
          fi

          echo "下载地址:"
          echo "$BIN_URL"

          curl -fL --retry 3 "$BIN_URL" \
            -o cfdata-linux-arm64

          if [ -n "$SUM_URL" ]; then
            curl -fL --retry 3 "$SUM_URL" \
              -o cfdata-linux-arm64.sha256

            echo "验证 SHA256..."

            cd "$(dirname cfdata-linux-arm64)"
            sha256sum -c cfdata-linux-arm64.sha256
            cd -
          fi

          chmod +x cfdata-linux-arm64

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          ls -lh cfdata-linux-arm64

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cfdata-web:latest
            ghcr.io/${{ github.repository_owner }}/cfdata-web:${{ steps.release.outputs.tag }}
